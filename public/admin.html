<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rival Surge — Server Admin</title>
  <style>
    body { font-family: system-ui, -apple-system, Roboto, "Segoe UI", Arial; margin: 0; display: flex; height: 100vh; }
    .left { width: 300px; border-right: 1px solid #e6eef5; padding: 12px; box-sizing: border-box; }
    .players { margin-top: 8px; }
    .player { padding: 6px; border-bottom: 1px solid #f1f6fa; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .kick-btn { padding: 4px 8px; color: #8b1e1e; cursor: pointer; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .chat { flex: 1; padding: 12px; overflow: auto; background: #f7fbfd; }
    .controls { padding: 8px; border-top: 1px solid #e6eef5; display: flex; gap: 8px; }
    .msg { margin-bottom: 10px; }
    .meta { color: #466; font-size: 12px; }
    .input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <div class="left">
    <h3>Connected Players</h3>
    <div id="players" class="players">(no players)</div>
  </div>
  <div class="main">
    <div style="padding:12px;border-bottom:1px solid #e6eef5"><strong>Server Chat</strong></div>
    <div id="chat" class="chat"></div>
    <div class="controls">
      <input id="msgInput" class="input" placeholder="Type message to broadcast to all clients" />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
<script src="admin.js?v=3" type="module"></script>
</body>
</html>
